[package]
name = "pen-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = [
  "devtools",
  "netplay",
  "video",
  "replay",
  "kernels",
  "locales",
  "saved-adapter",
  "sound-recipes",
  "mesh-json",
  "texture-recipes",
  "shader-graph",
  "render-rt",
  "render-2d",
  "render-env",
  "render-particles",
  "render-lines",
  "render-jfa-outline",
  "render-meshlets",
  "render-oit",
  "render-atmosphere",
  "render-pbr-decals",
  "render-post-fx",
]
# General-purpose static single-player host (omits dev tools, netplay, video,
# replay recording, runtime mesh/texture/shader recipes, and software RT).
compact = [
  "kernels",
  "locales",
  "saved-adapter",
  "sound-recipes",
  "render-2d",
  "render-env",
  "render-particles",
  "render-lines",
  "render-jfa-outline",
  "render-meshlets",
  "render-oit",
  "render-atmosphere",
  "render-pbr-decals",
  "render-post-fx",
]
devtools = ["pen-protocol/diagnostics", "pen-runtime/semantic"]
netplay = ["pen-runtime/netplay"]
video = []
replay = ["pen-runtime/replay"]
kernels = []
locales = ["pen-runtime/locales"]
saved-adapter = ["dep:pen-ink"]
sound-recipes = ["pen-runtime/sound-recipes"]
mesh-json = ["pen-render/mesh-json"]
texture-recipes = ["pen-render/texture-recipes"]
shader-graph = ["pen-render/shader-graph"]
render-rt = ["pen-render/render-rt"]
render-2d = ["pen-render/render-2d"]
render-env = ["pen-render/render-env"]
render-particles = ["pen-render/render-particles"]
render-lines = ["pen-render/render-lines"]
render-jfa-outline = ["pen-render/render-jfa-outline"]
render-meshlets = ["pen-render/render-meshlets"]
render-oit = ["pen-render/render-oit"]
render-atmosphere = ["pen-render/render-atmosphere"]
render-pbr-decals = ["pen-render/render-pbr-decals"]
render-post-fx = ["pen-render/render-post-fx"]

# The browser host builds for wasm32-unknown-unknown (build.sh, with the
# workspace's `web` profile); for any other target the crate is empty, so
# the workspace builds and lints as a whole.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow.workspace = true
pen-protocol = { path = "../pen-protocol", default-features = false }
pen-runtime = { path = "../pen-runtime", default-features = false }
pen-ink = { path = "../pen-ink", optional = true }
pen-render = { path = "../pen-render", default-features = false }
pen-simulation.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["async-await-macro"] }
js-sys = "0.3.106"
serde_json = "1"
# build.sh installs the wasm-bindgen CLI of the version Cargo.lock pins.
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-time = "1"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "DomRect", "console", "Window", "Document", "Element", "EventTarget", "Event", "KeyboardEvent", "MouseEvent", "WheelEvent", "Response", "Request", "RequestInit", "Headers", "Storage", "Location", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "DomException", "Performance", "Navigator", "Clipboard", "CssStyleDeclaration", "HtmlElement", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioParam", "GainNode", "StereoPannerNode", "BiquadFilterNode", "BiquadFilterType", "ConvolverNode", "DynamicsCompressorNode", "AudioScheduledSourceNode", "MediaQueryList", "UrlSearchParams", "Url", "EventSource", "MessageEvent", "PointerEvent", "InputEvent", "CompositionEvent", "HtmlTextAreaElement", "Gamepad", "GamepadButton", "GamepadMappingType", "PannerNode", "PanningModelType", "DistanceModelType", "AnalyserNode", "ChannelSplitterNode", "AudioContextOptions", "HtmlAudioElement", "HtmlMediaElement", "MediaElementAudioSourceNode", "Blob", "BlobPropertyBag", "DragEvent", "DataTransfer", "File", "FileList", "HtmlAnchorElement", "HtmlInputElement", "WebSocket", "BinaryType", "RtcDataChannel", "RtcDataChannelType", "RtcDataChannelState", "OscillatorNode", "OscillatorType"] }
wgpu.workspace = true
