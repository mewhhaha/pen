[package]
name = "pen-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["semantic", "locales", "replay", "sound-recipes", "netplay"]
semantic = ["pen-protocol/diagnostics"]
locales = ["dep:unicode-bidi"]
replay = ["dep:miniz_oxide"]
sound-recipes = []
netplay = []

[dependencies]
anyhow.workspace = true
pen-protocol = { workspace = true, default-features = false }
# Source maps (symbols.rs), already pen-protocol's, and the player's action
# bindings, kept with their preferences (actions).
# Deflates the recordings that links carry (recording::fragment).
miniz_oxide = { version = "0.9", optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-bidi = { version = "0.3", optional = true }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true, features = ["std"] }
