[package]
name = "pen-plugin-gdev-assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WGSL reflection: the shaders' Parameters structs and scalar constants.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
# What WGSL counts as an identifier's character (naga's own choice).
unicode-ident = "1"

# The component's bindings (src/component.rs) exist only in the Wasm build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }

[dev-dependencies]
# Reads the fixtures; no features, so the blot plugin's serde_json is unchanged.
serde_json = "1"
