name: Publish Linux Pen tools

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Pen tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 4
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake libasound2-dev libdbus-1-dev libudev-dev ninja-build pkg-config
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - name: Install Binaryen
        run: |
          cd "$RUNNER_TEMP"
          archive=binaryen-version_133-x86_64-linux.tar.gz
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_133/$archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $archive" | sha256sum -c
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build CLI, compiler plugin, and browser host
        run: |
          PEN_BUILD=$(git rev-parse HEAD)
          export PEN_BUILD
          mkdir -p bundle/plugins
          cargo build --locked --release -p pen
          install -m 755 target/release/pen bundle/pen
          (
            cd plugins
            cargo build --locked --release --target wasm32-wasip2
          )
          install -m 644 plugins/target/wasm32-wasip2/release/pen_plugin_squid.wasm bundle/plugins/squid.wasm
          sh crates/pen-web/build.sh "$PWD/bundle/web"
          sh crates/pen-web/build.sh "$PWD/bundle/web-compact" --compact
          sh crates/pen-web/build.sh "$PWD/bundle/web-3d" --3d
          sh crates/pen-web/build.sh "$PWD/bundle/web-2d" --2d
          cp LICENSE THIRD_PARTY_NOTICES.md bundle/
          printf '%s\n' "$PEN_BUILD" > bundle/source-commit
      - name: Smoke check and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          reported_version=$(bundle/pen --version)
          echo "$reported_version"
          [[ "$reported_version" == "pen $version "* ]]
          bundle/pen --help > bundle-help.txt
          grep -F 'tool NAME [ARGS...]' bundle-help.txt
          test -s bundle/plugins/squid.wasm
          test -s bundle/web/pen_web_bg.wasm
          test -d bundle/web/shaders
          test -s bundle/web-compact/pen_web_bg.wasm
          test -d bundle/web-compact/shaders
          test -s bundle/web-3d/pen_web_bg.wasm
          test -d bundle/web-3d/shaders
          test -s bundle/web-2d/pen_web_bg.wasm
          archive="pen-tools-$version-ubuntu-24.04-x86_64.tar.gz"
          tar -czf "$archive" -C bundle .
          sha256sum "$archive" > "$archive.sha256"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Pen $version" \
            --notes 'Development CLI, Squid compiler plugin, and browser host for Ubuntu 24.04 x86_64. Extract the archive and add its directory to PATH. Install libasound2t64, libdbus-1-3, and libudev1 for the native CLI.' \
            "$archive" "$archive.sha256"
