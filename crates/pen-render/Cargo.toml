[package]
name = "pen-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wgpu renderer for pen's render packets, native and in the browser"

[lints]
workspace = true

[features]
# Simpler levels of detail for meshes where assets are packaged
# (`pack_mesh_with_lods`): pen's packaging has it, the browser host does not.
simplify = ["dep:meshopt-rs"]

[dependencies]
anyhow.workspace = true
pen-protocol.workspace = true
pen-texture.workspace = true
bytemuck = { version = "1", features = ["derive"] }
flate2 = "1"
# meshoptimizer's simplifier (0.15, where it was still marked experimental),
# ported to Rust: no C++ to build.
meshopt-rs = { version = "0.1.2", features = ["experimental"], optional = true }
log = "0.4"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu.workspace = true
# Recipe textures reconstruct their channels from an embedded painting on
# either host. Ordinary browser images still use the page's decoder.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Natively, asset files are read and decoded on loader threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# In the browser, assets are fetched and decoded by the page (see web/).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "ColorSpaceConversion",
  "ImageBitmap",
  "ImageBitmapOptions",
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "Performance",
  "PremultiplyAlpha",
  "Response",
  "Window",
  "WorkerGlobalScope",
] }

[dev-dependencies]
# The asset pipeline's encoders and MSDF atlases, for what the tests draw.
pen-texture = { workspace = true, features = ["tools"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
