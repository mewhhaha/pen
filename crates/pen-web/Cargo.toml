[package]
name = "pen-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = [
  "render-3d",
  "deferred-shaders",
  "audio-advanced",
  "file-saves",
  "gamepad",
  "devtools",
  "netplay",
  "video",
  "replay",
  "kernels",
  "locales",
  "saved-adapter",
  "sound-recipes",
  "mesh-json",
  "texture-recipes",
  "shader-graph",
  "render-rt",
  "render-2d",
  "render-env",
  "render-particles",
  "render-lines",
  "render-jfa-outline",
  "render-meshlets",
  "render-oit",
  "render-atmosphere",
  "render-pbr-decals",
  "render-post-fx",
  "render-volume",
  "render-ssgi",
  "render-subsurface",
  "render-taa",
  "render-dof",
  "render-area-lights",
  "render-decals",
  "render-particles-cpu",
  "render-gpu-culling",
]
# General-purpose static single-player host (omits dev tools, netplay, video,
# replay recording, runtime mesh/texture/shader recipes, and software RT).
compact = [
  "render-3d",
  "deferred-shaders",
  "audio-advanced",
  "gamepad",
  "kernels",
  "locales",
  "saved-adapter",
  "sound-recipes",
  "render-2d",
  "render-env",
  "render-particles",
  "render-lines",
  "render-jfa-outline",
  "render-meshlets",
  "render-oit",
  "render-atmosphere",
  "render-pbr-decals",
  "render-post-fx",
  "render-volume",
  "render-ssgi",
  "render-subsurface",
  "render-taa",
  "render-dof",
  "render-area-lights",
  "render-decals",
  "render-particles-cpu",
  "render-gpu-culling",
]
# Slim 3D static host (core PBR + standard RenderFrame passes; no 2D/env/recipes/locales/kernels).
web-3d = [
  "render-3d",
  "deferred-shaders",
  "audio-advanced",
  "gamepad",
  "render-oit",
  "render-atmosphere",
  "render-pbr-decals",
  "render-post-fx",
]
# Pure 2D / UI static host (no 3D PBR renderer, lean WebAudio).
web-2d = [
  "render-2d",
  "gamepad",
]
render-3d = ["pen-render/render-3d"]
deferred-shaders = ["pen-render/deferred-shaders"]
audio-advanced = [
  "web-sys/AnalyserNode",
  "web-sys/BiquadFilterNode",
  "web-sys/BiquadFilterType",
  "web-sys/Blob",
  "web-sys/BlobPropertyBag",
  "web-sys/ChannelSplitterNode",
  "web-sys/ConvolverNode",
  "web-sys/DistanceModelType",
  "web-sys/DynamicsCompressorNode",
  "web-sys/HtmlAudioElement",
  "web-sys/HtmlMediaElement",
  "web-sys/MediaElementAudioSourceNode",
  "web-sys/OscillatorNode",
  "web-sys/OscillatorType",
  "web-sys/PannerNode",
  "web-sys/PanningModelType",
  "web-sys/Url",
]
file-saves = [
  "web-sys/Blob",
  "web-sys/BlobPropertyBag",
  "web-sys/DataTransfer",
  "web-sys/DragEvent",
  "web-sys/File",
  "web-sys/FileList",
  "web-sys/HtmlAnchorElement",
  "web-sys/HtmlInputElement",
  "web-sys/Url",
]
gamepad = [
  "web-sys/Gamepad",
  "web-sys/GamepadButton",
  "web-sys/GamepadMappingType",
]
devtools = [
  "file-saves",
  "pen-protocol/diagnostics",
  "pen-runtime/semantic",
  "web-sys/EventSource",
]
netplay = [
  "pen-runtime/netplay",
  "web-sys/BinaryType",
  "web-sys/RtcDataChannel",
  "web-sys/RtcDataChannelState",
  "web-sys/RtcDataChannelType",
  "web-sys/WebSocket",
]
video = ["render-3d"]
replay = ["file-saves", "pen-runtime/replay"]
kernels = []
locales = ["pen-runtime/locales"]
saved-adapter = ["dep:pen-ink"]
sound-recipes = ["pen-runtime/sound-recipes"]
mesh-json = ["pen-render/mesh-json"]
texture-recipes = ["pen-render/texture-recipes"]
shader-graph = ["pen-render/shader-graph"]
render-rt = ["pen-render/render-rt"]
render-2d = ["pen-render/render-2d"]
render-env = ["pen-render/render-env"]
render-particles = ["pen-render/render-particles"]
render-lines = ["pen-render/render-lines"]
render-jfa-outline = ["pen-render/render-jfa-outline"]
render-meshlets = ["pen-render/render-meshlets"]
render-oit = ["pen-render/render-oit"]
render-atmosphere = ["pen-render/render-atmosphere"]
render-pbr-decals = ["pen-render/render-pbr-decals"]
render-post-fx = ["pen-render/render-post-fx"]
render-volume = ["pen-render/render-volume"]
render-ssgi = ["pen-render/render-ssgi"]
render-subsurface = ["pen-render/render-subsurface"]
render-taa = ["pen-render/render-taa"]
render-dof = ["pen-render/render-dof"]
render-area-lights = ["pen-render/render-area-lights"]
render-decals = ["pen-render/render-decals"]
render-particles-cpu = ["pen-render/render-particles-cpu"]
render-gpu-culling = ["pen-render/render-gpu-culling"]

# The browser host builds for wasm32-unknown-unknown (build.sh, with the
# workspace's `web` profile); for any other target the crate is empty, so
# the workspace builds and lints as a whole.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow.workspace = true
pen-protocol = { path = "../pen-protocol", default-features = false }
pen-runtime = { path = "../pen-runtime", default-features = false }
pen-ink = { path = "../pen-ink", optional = true }
pen-render = { path = "../pen-render", default-features = false }
pen-simulation.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["async-await-macro"] }
js-sys = "0.3.106"
serde_json = "1"
# build.sh installs the wasm-bindgen CLI of the version Cargo.lock pins.
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-time = "1"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "DomRect", "console", "Window", "Document", "Element", "EventTarget", "Event", "KeyboardEvent", "MouseEvent", "WheelEvent", "Response", "Request", "RequestInit", "Headers", "Storage", "Location", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "DomException", "Performance", "Navigator", "Clipboard", "CssStyleDeclaration", "HtmlElement", "AudioContext", "AudioContextOptions", "AudioContextState", "AudioDestinationNode", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioParam", "GainNode", "StereoPannerNode", "AudioScheduledSourceNode", "MediaQueryList", "UrlSearchParams", "MessageEvent", "PointerEvent", "InputEvent", "CompositionEvent", "HtmlTextAreaElement"] }
wgpu.workspace = true
