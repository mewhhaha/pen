name: Publish Linux Pen tools

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binaryen clang cmake libasound2-dev libdbus-1-dev libudev-dev ninja-build pkg-config
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Build CLI, compiler plugin, and browser host
        env:
          PEN_BUILD: ${{ github.sha }}
        run: |
          mkdir -p bundle/plugins
          cargo build --locked --release -p pen
          install -m 755 target/release/pen bundle/pen
          (
            cd plugins
            cargo build --locked --release --target wasm32-wasip2
          )
          install -m 644 plugins/target/wasm32-wasip2/release/pen_plugin_blot.wasm bundle/plugins/blot.wasm
          sh crates/pen-web/build.sh "$PWD/bundle/web"
          cp LICENSE THIRD_PARTY_NOTICES.md bundle/
          printf '%s\n' "$GITHUB_SHA" > bundle/source-commit
      - name: Smoke check and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          reported_version=$(bundle/pen --version)
          echo "$reported_version"
          [[ "$reported_version" == "pen $version "* ]]
          bundle/pen tool --help
          test -s bundle/plugins/blot.wasm
          test -s bundle/web/pen_web_bg.wasm
          archive="pen-tools-$version-ubuntu-24.04-x86_64.tar.gz"
          tar -czf "$archive" -C bundle .
          sha256sum "$archive" > "$archive.sha256"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Pen $version" \
            --notes 'Development CLI, Blot compiler plugin, and browser host for Ubuntu 24.04 x86_64. Extract the archive and add its directory to PATH. Install libasound2t64, libdbus-1-3, and libudev1 for the native CLI.' \
            "$archive" "$archive.sha256"
