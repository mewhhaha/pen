# Native/browser verification and portable player builds.
# The game job requires sibling checkout repository and revision variables
# and the CHECKOUTS_TOKEN secret; the package and windows-smoke jobs take
# its game to the Windows player, and the macOS job to an app bundle.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # zig as cargo-zigbuild runs it; the version the Justfile recipes were tried with.
  ZIG_VERSION: 0.17.0
  # binaryen, whose wasm-opt crates/pen-web/build.sh runs, and its release
  # tarball's checksum.
  BINARYEN_VERSION: "133"
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
  # mdBook, which builds the docs site, and its release tarball's checksum.
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  linux:
    name: Linux build, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Game tests not configured
        # The game job below needs these; without them it is skipped.
        if: ${{ vars.GDEV_REPOSITORY == '' || vars.BLOT2_REPOSITORY == '' || vars.GDEV_REF == '' || vars.BLOT2_REF == '' || vars.INK_REPOSITORY == '' || vars.INK_REF == '' }}
        run: echo "::warning title=Game tests skipped::Set the GDEV_REPOSITORY, GDEV_REF, BLOT2_REPOSITORY, BLOT2_REF, INK_REPOSITORY and INK_REF repository variables and the CHECKOUTS_TOKEN secret to run them."
      - name: System libraries
        # ALSA and D-Bus for audio (cpal), CMake for libopus, lavapipe for
        # the GPU tests, ffmpeg for the recording tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libdbus-1-dev mesa-vulkan-drivers ffmpeg
      - name: Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal
          rustup component add clippy rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      - name: binaryen
        run: |
          cd "$RUNNER_TEMP"
          archive=binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$archive"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/binaryen-version_$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Build (with Steam)
        run: cargo build --workspace --all-targets --features pen/steam
      - name: Build the player runtime (no compiler)
        run: cargo build -p pen --no-default-features --features steam
      - name: Compiler component and tests
        run: |
          cargo build --manifest-path plugins/Cargo.toml --release --target wasm32-wasip2
          cargo test --manifest-path plugins/Cargo.toml
      - name: Browser host
        run: |
          sh crates/pen-web/build.sh
          cargo clippy -p pen-web --target wasm32-unknown-unknown -- -D warnings
          # The simulation services in wasm32 answer with native's bits.
          node crates/pen-web/tests/services.mjs
      - name: Formatting (rustfmt.toml)
        run: |
          cargo fmt --all --check
          cd plugins && cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features pen/steam -- -D warnings
      - name: Clippy, every combination of pen's features
        # The default one and the player runtime's (steam alone) among them.
        run: cargo hack clippy -p pen --feature-powerset --exclude-features default --all-targets -- -D warnings
      - name: Tests
        # wgpu finds lavapipe as the only adapter; PEN_SOFTWARE makes pen
        # itself ask for the software one.
        env:
          PEN_SOFTWARE: "1"
        run: cargo test --workspace -- --test-threads=1
      - name: Renderer tests in release
        env:
          PEN_SOFTWARE: "1"
        run: cargo test --release -p pen-render -- --test-threads=1

  docs:
    name: Docs site (mdBook)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mdBook
        run: |
          cd "$RUNNER_TEMP"
          archive=mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/$archive"
          echo "$MDBOOK_SHA256  $archive" | sha256sum -c
          tar -xzf "$archive"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/book
          if-no-files-found: error

  deny:
    name: Licenses, advisories and bans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny@0.20.2
      - name: cargo deny (deny.toml), for each lockfile
        run: just deny

  player:
    name: Player runtimes (Linux glibc 2.28, Windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config cmake libasound2-dev libdbus-1-dev
      - name: Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal
          rustup target add x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - name: Linux player runtime, glibc 2.28
        # `just player` also checks the newest glibc symbol it needs.
        run: just player
      - name: Windows player runtime
        run: just windows
      - name: Sign the Windows player (when a certificate is set)
        # Authenticode with the WINDOWS_CERTIFICATE secret (a .pfx, in
        # base64) and WINDOWS_CERTIFICATE_PASSWORD, timestamped; without
        # them it says so and the player ships unsigned.
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            sudo apt-get install -y --no-install-recommends osslsigncode
          fi
          scripts/sign-windows.sh target/x86_64-pc-windows-gnu/dist/player/pen.exe
      - name: Player size budgets
        # docs/shipping.md, "Budgets": a player that outgrows its budget fails.
        run: just size-budget
      - uses: actions/upload-artifact@v4
        with:
          name: player-runtimes
          path: |
            target/x86_64-unknown-linux-gnu/dist/player/
            target/x86_64-pc-windows-gnu/dist/player/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        # The same builds unstripped: what resolves their crash reports.
        with:
          name: player-runtime-symbols
          path: |
            target/x86_64-unknown-linux-gnu/dist/pen
            target/x86_64-pc-windows-gnu/dist/pen.exe
          if-no-files-found: error

  windows:
    name: Windows player and renderer (WARP)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # No GPU here: DX12 on WARP, Windows' software adapter.
      WGPU_BACKEND: dx12
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Player runtime (MSVC)
        run: cargo build --release -p pen --no-default-features --features steam
      - name: It starts
        # Beside Steam's library, as pen build ships it. The player has no
        # console (the Windows subsystem); bash gives it pipes for its output.
        run: |
          cp "$(find target/release/build -path '*/steamworks-sys-*/out/steam_api64.dll' | head -n 1)" target/release/
          target/release/pen.exe --version
      - name: Runtime, protocol and renderer tests on WARP
        run: |
          cargo test --release -p pen-runtime -p pen-protocol -p pen-render -- --test-threads=1
          cargo test --release -p pen --no-default-features --features steam -- app_bundle project::

  android:
    name: Portable crates for Android (clippy)
    # The protocol, runtime, renderer and guest host; pen itself is not yet
    # ported (docs/android.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal
          rustup component add clippy
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for aarch64-linux-android
        # The runner image's NDK compiles wasmtime's C helpers.
        run: |
          ndk=${ANDROID_NDK_LATEST_HOME:?the runner image has no Android NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$ndk/aarch64-linux-android24-clang AR_aarch64_linux_android=$ndk/llvm-ar
          cargo clippy --target aarch64-linux-android -p pen-protocol -p pen-runtime -p pen-render -p blot-host -- -D warnings
          cargo clippy --target aarch64-linux-android -p blot-host --no-default-features -- -D warnings

  game:
    name: Game tests (needs the gdev and blot2 checkouts)
    # A pull request from a fork gets no CHECKOUTS_TOKEN to read them with.
    if: ${{ vars.GDEV_REPOSITORY != '' && vars.BLOT2_REPOSITORY != '' && vars.GDEV_REF != '' && vars.BLOT2_REF != '' && vars.INK_REPOSITORY != '' && vars.INK_REF != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    # A test whose game fixtures are missing fails here instead of skipping,
    # so a checkout that went wrong cannot pass.
    env:
      PEN_REQUIRE_FIXTURES: "1"
    defaults:
      run:
        working-directory: pen
    steps:
      # The recipes expect the checkouts side by side: ../gdev, ../blot2.
      - uses: actions/checkout@v4
        with:
          path: pen
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GDEV_REPOSITORY }}
          ref: ${{ vars.GDEV_REF }}
          token: ${{ secrets.CHECKOUTS_TOKEN }}
          path: gdev
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BLOT2_REPOSITORY }}
          ref: ${{ vars.BLOT2_REF }}
          token: ${{ secrets.CHECKOUTS_TOKEN }}
          path: blot2
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.INK_REPOSITORY }}
          ref: ${{ vars.INK_REF }}
          token: ${{ secrets.CHECKOUTS_TOKEN }}
          path: ink
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libdbus-1-dev mesa-vulkan-drivers ffmpeg
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pen
      - name: Native compiler and component
        run: |
          cd ../blot2/zig-native
          zig build install compiler-identity -Doptimize=fast
          mkdir -p ../generated/compiler
          gzip -c zig-out/bin/blotc > ../generated/compiler/blotc.gz
          cd ../../pen
          just plugins
      - name: Protocol freshness and game tests
        env:
          PEN_SOFTWARE: "1"
        run: |
          cargo run --release -q -p pen -- codegen --project ../gdev --rust crates/pen-protocol/src/packets.rs --check
          just packets
          cargo test --workspace -- --test-threads=1
          just blot-tests
          just determinism
      - name: Example games and a new one
        # bounce's tests, golden images and own sections, and a game `pen
        # new` makes, compiled, tested and drawn, on lavapipe.
        env:
          PEN_SOFTWARE: "1"
        run: just examples
      - name: binaryen
        # The browser export builds its host optimized, as `just install` does.
        run: |
          cd "$RUNNER_TEMP"
          archive=binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$archive"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/binaryen-version_$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Native package and browser export
        run: |
          cargo run --release -q -p pen -- build --project ../gdev --out dist/package
          cargo run --release -q -p pen -- build --web --project ../gdev --out dist/web
      - name: Reproducible package, its size and its cold start
        # Built twice with cold caches, the package must be the same bytes;
        # its game within its budget; and its runtime's time from a cold
        # start to the first frame, on lavapipe, within CI's budget
        # (docs/shipping.md, "Release checks").
        env:
          PEN_COLD_START_FLAGS: --software
        run: |
          scripts/reproducible.sh target/release/pen ../gdev target/reproducible
          scripts/size-budget.sh dist/package/game 110
          scripts/cold-start.sh dist/package/gdev 180000 1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Headless browser prerequisites
        # The Justfile's pinned pnpm and playwright-core, then the system
        # libraries Chromium needs.
        run: |
          just browser-tools
          node target/browser-tools/node_modules/playwright-core/cli.js install-deps chromium
      - name: Browser host and engine qualification
        run: |
          PLAYWRIGHT_MODULE="$(pwd)/target/browser-tools/node_modules/playwright-core/index.mjs"
          export PLAYWRIGHT_MODULE
          python3 -m http.server --bind 127.0.0.1 --directory dist/web 8044 > target/browser-server.log 2>&1 &
          browser_server=$!
          trap 'kill "$browser_server"' EXIT
          PEN_FXAA_WITNESSES=dist/web/fxaa cargo test --release -p pen-render post::fxaa_tests -- --test-threads=1
          PEN_FXAA_URL=http://127.0.0.1:8044/fxaa/ node crates/pen-web/tests/fxaa.mjs
          cargo run --release -q -p pen -- packets target/browser-conformance --project ../gdev --script-file tests/conformance.steps
          PEN_CONFORMANCE_URL=http://127.0.0.1:8044/qualification.html node crates/pen-web/tests/conformance.mjs
      # What the package, windows-smoke and macos jobs build on, before the
      # golden images so that a failing image does not hold them back: the
      # exported game, this pen (which packages it for another platform's
      # runtime) and the conformance packets every platform's must equal.
      - uses: actions/upload-artifact@v4
        with:
          name: game-bundle
          path: pen/dist/gdev
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pen-linux
          path: pen/target/release/pen
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-packets
          path: pen/target/browser-conformance
          if-no-files-found: error
      - name: Golden images on lavapipe
        # Each scenario settles on the CPU first: lavapipe compiles every
        # pipeline in seconds (pen waits up to ten minutes on a software
        # adapter).
        timeout-minutes: 90
        env:
          PEN_SOFTWARE: "1"
        run: just visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          # Relative to the workspace, not the working directory above.
          path: |
            gdev/.pen/visual
            pen/examples/*/.pen/visual
          # .pen is a hidden directory, which upload-artifact skips unless told.
          include-hidden-files: true
          if-no-files-found: ignore

  package:
    name: Packages for Windows and Linux from the game job's bundle
    needs: [player, game]
    # Whenever the game job ran: its artifacts come before its golden images.
    if: ${{ !cancelled() && needs.player.result == 'success' && needs.game.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # pen's own, and lavapipe for the Linux package's smoke.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev mesa-vulkan-drivers
      - uses: actions/download-artifact@v4
        with:
          name: player-runtimes
          path: runtimes
      - uses: actions/download-artifact@v4
        with:
          name: game-bundle
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: pen-linux
          path: pen-linux
      - uses: actions/download-artifact@v4
        with:
          name: native-packets
          path: native-packets
      - name: Package the game for each player runtime
        # Artifacts lose the executable bit.
        run: |
          chmod +x pen-linux/pen runtimes/*/dist/player/pen*
          pen-linux/pen build --game bundle --runtime runtimes/x86_64-pc-windows-gnu/dist/player/pen.exe --out packages/windows
          pen-linux/pen build --game bundle --runtime runtimes/x86_64-unknown-linux-gnu/dist/player/pen --out packages/linux
      - name: Linux package on lavapipe, its packets against the checkout's
        run: scripts/smoke.sh packages/linux/gdev smoke/linux native-packets
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: packages/windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke/linux
          if-no-files-found: ignore

  windows-smoke:
    name: Windows package on WARP, its packets against Linux's
    needs: package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WGPU_BACKEND: dx12
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-windows
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: native-packets
          path: native-packets
      - name: A few frames on WARP, and the conformance packets
        # A headless run or a command that stops with an error writes its
        # crash report and shows no message box; the timeout is for the rest.
        timeout-minutes: 20
        run: scripts/smoke.sh package/gdev.exe smoke native-packets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke
          if-no-files-found: ignore

  macos:
    name: macOS build, player and app bundle (Metal)
    # macOS runners cost ten times Linux's minutes on private repositories:
    # main, tags and manual runs, or every run with MACOS_CI set to always.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || vars.MACOS_CI == 'always') }}
    # The game job's bundle, when it ran, becomes the app bundle's game.
    needs: game
    runs-on: macos-14
    env:
      WGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: pen and the player runtime
        # The player, with Steam as it ships, apart, so that neither build
        # replaces the other's pen; the pen that packages it needs no Steam.
        run: |
          cargo build --release -p pen
          cargo build --release -p pen --no-default-features --features steam --target-dir target/player
      - name: Runtime, protocol and renderer tests on Metal
        run: |
          cargo test --release -p pen-runtime -p pen-protocol -p pen-render -- --test-threads=1
          cargo test --release -p pen -- app_bundle project::
      - uses: actions/download-artifact@v4
        if: needs.game.result != 'skipped'
        with:
          name: game-bundle
          path: bundle
      - uses: actions/download-artifact@v4
        if: needs.game.result != 'skipped'
        with:
          name: native-packets
          path: native-packets
      - name: App bundle
        if: needs.game.result != 'skipped'
        env:
          MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
        run: target/release/pen build --game bundle --runtime target/player/release/pen ${MACOS_BUNDLE_ID:+--bundle-id "$MACOS_BUNDLE_ID"} --out dist/macos
      - name: Sign, and notarize with the owner's credentials
        # Without MACOS_CERTIFICATE it signs ad hoc, which runs here only.
        if: needs.game.result != 'skipped'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: scripts/macos-sign.sh dist/macos/gdev.app
      - name: The app's runtime on Metal, its packets against Linux's
        if: needs.game.result != 'skipped'
        # macOS has no software adapter to ask for.
        env:
          PEN_SMOKE_GPU: "1"
        run: scripts/smoke.sh dist/macos/gdev.app/Contents/MacOS/gdev smoke native-packets
      - name: Zip the app bundle
        # ditto keeps the signature's extended attributes.
        if: needs.game.result != 'skipped'
        run: ditto -c -k --keepParent dist/macos/gdev.app dist/gdev-macos.zip
      - uses: actions/upload-artifact@v4
        if: needs.game.result != 'skipped'
        with:
          name: app-macos
          path: dist/gdev-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && needs.game.result != 'skipped'
        with:
          name: smoke-macos
          path: smoke
          if-no-files-found: ignore
