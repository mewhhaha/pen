# The renderer for the browser: pen-render on wgpu's WebGPU backend, with a
# wasm-bindgen API shaped like renderer.ts's `createRenderer`. Its own
# workspace, so native builds never link it; build it with ./build.sh.
[package]
name = "pen-render-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
pen-protocol = { path = "../../pen-protocol" }
pen-render = { path = ".." }
js-sys = "0.3.106"
serde_json = "1"
# The wasm-bindgen CLI that build.sh runs must be this exact version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "console"] }
wgpu = "30"

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
