[package]
name = "pen-plugin-blot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

# The component's bindings (src/component.rs) exist only in the Wasm build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }

[dev-dependencies]
# Unpacks blot2's packaged compiler for the tests.
flate2 = "1"
