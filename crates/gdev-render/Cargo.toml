[package]
name = "gdev-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wgpu renderer for gdev render packets (port of gdev's renderer.ts)"

[dependencies]
anyhow.workspace = true
gdev-protocol.workspace = true
bytemuck = { version = "1", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu.workspace = true
