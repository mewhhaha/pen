# pen's Wasm plugins (wit/pen-plugin.wit): components built for wasm32-wasip2
# (`just plugins`), apart from the runtime's workspace. Each keeps its logic
# in plain Rust that `cargo test` here checks natively; only its component
# bindings are Wasm-only.
[workspace]
resolver = "3"
members = ["blot"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
