[package]
name = "blot-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs Blot owned-storage guest programs on Wasmtime"

[lints]
workspace = true

[features]
default = ["compiler"]
# Cranelift, to compile Wasm. Without it only modules precompiled by a build
# with it (`pen build`) load, and the runtime is several MB smaller.
compiler = ["wasmtime/cranelift", "wasmtime/incremental-cache", "wasmtime/parallel-compilation", "dep:sha2", "dep:wasm-encoder", "dep:wasmparser"]

[dependencies]
anyhow.workspace = true
# Arrays cross the boundary as little-endian words, which on this machine
# are its own: copied whole, and their buffers reused.
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# The compiled-module cache's keys.
sha2 = { version = "0.10", optional = true }
pen-runtime.workspace = true
wasmtime.workspace = true
# Reads which globals a module exports (images); wasmtime's own version.
wasmparser = { version = "0.258", default-features = false, features = ["std"], optional = true }

wasm-encoder = { version = "0.258", features = ["wasmparser"], optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Numeric probes and fixture generation compile through the checkout's plugin.
pen-plugins.workspace = true
# The memory_images example plays a game's frames.
pen-protocol.workspace = true

[[example]]
name = "compile_time"
required-features = ["compiler"]

[[example]]
name = "memory_images"
required-features = ["compiler"]

[[example]]
name = "evaluate"
required-features = ["compiler"]

[[example]]
name = "compare"
required-features = ["compiler"]

[[example]]
name = "compare_workers"
required-features = ["compiler"]

[[example]]
name = "compare_worker_batches"
required-features = ["compiler"]
