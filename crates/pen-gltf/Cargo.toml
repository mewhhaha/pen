[package]
name = "pen-gltf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "glTF 2.0 import for pen's asset pipeline: meshes, materials, skins and clips as the renderer's assets, and vertex-animation textures baked from them"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
flate2 = "1"
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_emissive_strength", "KHR_materials_unlit"] }
pen-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pen-protocol.workspace = true
pollster = "1"
wgpu.workspace = true
